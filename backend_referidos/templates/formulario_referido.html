<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Referido - Vitaesentia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; background: #f8fafc; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 24px; padding: 40px; max-width: 450px; width: 100%; box-shadow: 0 20px 40px #0000000d; }
        h1 { text-align: center; color: #0f172a; font-size: 1.6rem; margin-bottom: 8px; }
        .subtitulo { text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 25px; }
        .referido-por { text-align: center; background: #eff6ff; border: 1px solid #bfdbfe; padding: 14px; border-radius: 12px; margin-bottom: 30px; font-size: 0.9rem; color: #334155; }
        .referido-por strong { color: #0056b3; font-size: 1.05rem; display: block; margin-top: 4px; overflow-wrap: anywhere; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.85rem; color: #334155; }
        input { width: 100%; padding: 14px 16px; border: 1px solid #e2e8f0; border-radius: 10px; font: inherit; background: #f8fafc; }
        input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #60a5fa; outline-offset: 3px; }
        .btn-submit { width: 100%; background: #0056b3; color: white; border: none; padding: 16px; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-submit:disabled { opacity: 0.65; cursor: wait; }
        .consentimiento { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; line-height: 1.5; cursor: pointer; }
        .consentimiento input { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; padding: 0; accent-color: #0056b3; }
        .form-error { color: #b91c1c; font-size: 0.85rem; margin-bottom: 16px; line-height: 1.6; }
        .form-reabrir { display: block; text-align: center; color: #0056b3; margin-top: 16px; }
        @media (max-width: 480px) { .card { padding: 28px 24px; } }
    </style>
</head>
<body>
    <main class="card">
        <h1>Bienvenido</h1>
        <p class="subtitulo">Completa tus datos para continuar</p>
        <div class="referido-por">Has sido invitado por: <strong>{{ nombre_colaborador }}</strong></div>
        {% if mensaje %}<p role="alert" class="form-error">{{ mensaje }}</p>{% endif %}
        <form id="form-referido" method="POST" action="{{ url_for('qr', ref=ref) }}">
            <input type="hidden" name="submission_id" value="{{ submission_id }}">
            <input type="hidden" name="submission_token" value="{{ submission_token }}">
            <div class="form-group"><label for="nombre">Nombre(s)</label><input id="nombre" name="nombre" autocomplete="given-name" value="{{ datos.nombre }}" required></div>
            <div class="form-group"><label for="apellido">Apellido(s)</label><input id="apellido" name="apellido" autocomplete="family-name" value="{{ datos.apellido }}" required></div>
            <div class="form-group"><label for="email">Correo electrónico</label><input id="email" type="email" name="email" autocomplete="email" value="{{ datos.email }}" required></div>
            <div class="form-group"><label for="telefono">Teléfono</label><input id="telefono" type="tel" name="telefono" autocomplete="tel" value="{{ datos.telefono }}" required></div>
            <label class="consentimiento" for="acepto_datos">
                <input type="checkbox" id="acepto_datos" name="acepto_datos" value="1" required {% if acepto_datos %}checked{% endif %}>
                <span>Acepto la política de protección de datos</span>
            </label>
            <button id="enviar-referido" type="submit" class="btn-submit" {% if not habilitado %}disabled{% endif %}>Enviar mis datos</button>
        </form>
        {% if not habilitado %}<a class="form-reabrir" href="{{ url_for('qr', ref=ref) }}">Volver a abrir formulario</a>{% endif %}
    </main>
    <script>
        const formulario = document.getElementById('form-referido');
        const boton = document.getElementById('enviar-referido');
        const habilitado = {{ habilitado | tojson }};
        let enviando = false;

        formulario.addEventListener('submit', function (event) {
            if (enviando || !habilitado) {
                event.preventDefault();
                return;
            }
            if (!formulario.checkValidity()) {
                event.preventDefault();
                formulario.reportValidity();
                return;
            }
            enviando = true;
            boton.disabled = true;
            boton.textContent = 'Enviando...';
            formulario.setAttribute('aria-busy', 'true');
        });

        // Al regresar con Atrás se reutilizan los identificadores originales.
        window.addEventListener('pageshow', function () {
            enviando = false;
            boton.disabled = !habilitado;
            boton.textContent = 'Enviar mis datos';
            formulario.removeAttribute('aria-busy');
        });
    </script>
</body>
</html>
